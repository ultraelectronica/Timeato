<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12100e">
  <meta name="description" content="Timeato - a Pomodoro timer with a pure Zig core, built on Zylix.">
  <title>Timeato</title>
  <style>
    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('fonts/outfit-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('fonts/outfit-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --bg: #12100e;
      --surface: #1c1916;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f5efe7;
      --muted: #a89d90;
      --accent: #ff6b57;
      --radius: 24px;
      --font: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: var(--font);
      color: var(--text);
      background: radial-gradient(130% 70% at 50% 0%, #27201a 0%, var(--bg) 62%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    #app { width: 100%; max-width: 420px; }

    .app {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 22px 20px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--surface) 0%, #171412 100%);
      box-shadow: 0 30px 60px -32px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .app.phase-focus { --accent: #ff6b57; }
    .app.phase-short_break { --accent: #46c9a4; }
    .app.phase-long_break { --accent: #7c9cff; }

    .topbar { display: flex; align-items: center; justify-content: space-between; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
    }

    .timer { display: flex; flex-direction: column; align-items: center; gap: 14px; }

    .display {
      font-size: clamp(3.6rem, 20vw, 5.2rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .caption {
      font-size: 0.74rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .progress { display: flex; gap: 6px; width: 100%; }

    .seg {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .seg.on { background: var(--accent); box-shadow: 0 0 10px -2px var(--accent); }

    .controls { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; }

    .btn {
      padding: 15px 8px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .btn:active { transform: scale(0.96); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn.primary { background: var(--accent); color: #12100e; }
    .btn.ghost { background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--line); }

    .history {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .history-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .history-count { color: var(--accent); letter-spacing: 0.04em; }

    .history-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }

    .hist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 0.85rem;
    }

    .hist-item::before {
      content: "";
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff6b57;
    }

    .hist-item.phase-short_break::before { background: #46c9a4; }
    .hist-item.phase-long_break::before { background: #7c9cff; }
    .hist-phase { color: var(--muted); }
    .hist-dur { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }

    .empty {
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      gap: 8px;
      background: var(--bg);
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 24px;
    }

    .boot[hidden] { display: none; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <div class="boot" id="boot">Spinning up the Zig core…</div>

  <script src="timeato.js"></script>
  <script>
    const boot = document.getElementById('boot');
    Timeato
      .init('timeato.wasm', document.getElementById('app'))
      .then(() => { boot.hidden = true; })
      .catch((error) => {
        boot.textContent = `Timeato failed to start: ${error.message}`;
        console.error(error);
      });
  </script>
</body>
</html>
